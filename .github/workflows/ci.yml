name: CI

on:
  push:
    branches: [main, feat/mvp-pipeline]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Mock pipeline smoke test
        run: |
          TTS_PROVIDER=mock pnpm medavatar voice demo
          test -f projects/demo/output/scene.json
          test -f projects/demo/output/timing.json
          test -f projects/demo/output/captions.json
          test -f projects/demo/output/alignment.json
          test -f projects/demo/output/chapters.json
          test -f projects/demo/output/narration.wav
          node -e "const s=require('./projects/demo/output/scene.json').scenes; if(s[0]?.id!=='intro'||s[0]?.title!=='高血压为什么会悄悄伤害血管'||s[0]?.avatar?.layout!=='hero'||s[2]?.id!=='vascular-injury'||s[2]?.subtitle?.style!=='social'||s.at(-1)?.id!=='home-monitoring'||s.at(-1)?.title!=='家庭血压管理') process.exit(1)"
          node -e "const c=require('./projects/demo/output/captions.json'); if(!Array.isArray(c)||c.length<2||!c.some(x=>x.characters?.length)) process.exit(1)"
          node -e "const c=require('./projects/demo/output/chapters.json'); if(!Array.isArray(c)||c.length<1||c.some(x=>x.duration<=0)) process.exit(1)"
          pnpm exec tsx -e "import {scriptToStoryboard} from './src/storyboard.ts'; let ok=false; try { scriptToStoryboard('x', '<!-- medavatar:id=same -->\\n甲\\n\\n<!-- medavatar:id=same -->\\n乙'); } catch (error) { ok=String(error).includes('Duplicate medavatar scene id'); } if (!ok) process.exit(1);"
          pnpm exec tsx -e "import {loadPreviewProps} from './src/production/renderProps.ts'; const run=async()=>{const p=await loadPreviewProps('demo'); if(p.timeline.source!=='actual'||p.timeline.stale||p.effective.scenes[2]?.subtitle?.style!=='social'||!Array.isArray(p.captions)||p.captions.length<2) process.exit(1);}; run();"
          pnpm exec tsx -e "import {setSceneAvatarLayout,setSceneAvatarScale,setSceneSubtitleStyle} from './src/editor/overrideDraft.ts'; const input={version:'1.0',scenes:{x:{subtitle:{mode:'karaoke',style:'social'},avatar:{layout:'bottom-right',scale:0.4}}}}; const subtitle=setSceneSubtitleStyle(input,'x','minimal'); const layout=setSceneAvatarLayout(subtitle,'x','bottom-left'); const scale=setSceneAvatarScale(layout,'x',0.33); const resetScale=setSceneAvatarScale(scale,'x',undefined); const resetLayout=setSceneAvatarLayout(resetScale,'x',undefined); if(scale.scenes.x?.subtitle?.style!=='minimal'||scale.scenes.x?.avatar?.layout!=='bottom-left'||scale.scenes.x?.avatar?.scale!==0.33||resetScale.scenes.x?.avatar?.scale!==undefined||resetScale.scenes.x?.avatar?.layout!=='bottom-left'||resetLayout.scenes.x?.avatar!==undefined||resetLayout.scenes.x?.subtitle?.mode!=='karaoke'||input.scenes.x?.avatar?.layout!=='bottom-right'||input.scenes.x?.avatar?.scale!==0.4) process.exit(1);"
          pnpm exec tsx -e "import {loadEffectiveProject} from './src/production/effectiveProject.ts'; const run=async()=>{const p=await loadEffectiveProject('demo',{overrides:{version:'1.0',scenes:{intro:{avatar:{layout:'bottom-right'}}}}}); const s=p.effective.scenes.find(x=>x.id==='intro'); if(s?.avatar?.layout!=='bottom-right'||s.avatar.scale!==0.28||p.timeline.source!=='actual') process.exit(1);}; run();"
      - name: Editor server smoke test
        run: |
          CI=true pnpm medavatar editor demo > /tmp/medavatar-editor.log 2>&1 &
          editor_pid=$!
          trap 'kill "$editor_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/api/projects/demo -o /tmp/editor-project.json; then
              break
            fi
            sleep 0.5
          done
          test -s /tmp/editor-project.json || (cat /tmp/medavatar-editor.log && exit 1)
          curl -fsS http://127.0.0.1:4173/ -o /tmp/editor-index.html
          curl -fsS http://127.0.0.1:4173/src/App.tsx -o /dev/null
          node -e "const p=require('/tmp/editor-project.json'); if(p.projectName!=='demo'||p.timeline?.source!=='actual'||!Array.isArray(p.effective?.scenes)||p.effective.scenes.length<1) process.exit(1)"

          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            --data '{"version":"1.0","scenes":{"vascular-injury":{"subtitle":{"style":"minimal"}},"intro":{"avatar":{"layout":"bottom-left"}}}}' \
            http://127.0.0.1:4173/api/projects/demo/resolve \
            -o /tmp/editor-resolved.json
          node -e "const p=require('/tmp/editor-resolved.json'); const intro=p.effective?.scenes?.find(x=>x.id==='intro'); if(p.overrides?.scenes?.['vascular-injury']?.subtitle?.style!=='minimal'||p.effective?.scenes?.find(x=>x.id==='vascular-injury')?.subtitle?.style!=='minimal'||intro?.avatar?.layout!=='bottom-left'||intro?.avatar?.scale!==0.28||p.timeline?.source!=='actual') process.exit(1)"

          cp projects/demo/storyboard.overrides.json /tmp/demo-overrides.json
          curl -fsS -X PUT \
            -H 'Content-Type: application/json' \
            --data '{"version":"1.0","scenes":{"vascular-injury":{"subtitle":{"style":"minimal"}},"intro":{"avatar":{"layout":"bottom-right","scale":0.31}}}}' \
            http://127.0.0.1:4173/api/projects/demo/overrides \
            -o /tmp/editor-saved.json
          node -e "const p=require('/tmp/editor-saved.json'); const intro=p.effective?.scenes?.find(x=>x.id==='intro'); if(p.overrides?.scenes?.intro?.avatar?.scale!==0.31||intro?.avatar?.layout!=='bottom-right'||intro?.avatar?.scale!==0.31||p.effective?.scenes?.find(x=>x.id==='vascular-injury')?.subtitle?.style!=='minimal') process.exit(1)"
          node -e "const p=require('./projects/demo/storyboard.overrides.json'); if(p.scenes?.intro?.avatar?.layout!=='bottom-right'||p.scenes?.intro?.avatar?.scale!==0.31||p.scenes?.['vascular-injury']?.subtitle?.style!=='minimal') process.exit(1)"
          cp /tmp/demo-overrides.json projects/demo/storyboard.overrides.json
