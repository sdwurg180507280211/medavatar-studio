name: CI

on:
  push:
    branches: [main, feat/mvp-pipeline]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Mock pipeline smoke test
        run: |
          TTS_PROVIDER=mock pnpm medavatar voice demo
          test -f projects/demo/output/scene.json
          test -f projects/demo/output/timing.json
          test -f projects/demo/output/captions.json
          test -f projects/demo/output/alignment.json
          test -f projects/demo/output/chapters.json
          test -f projects/demo/output/narration.wav
          node -e "const s=require('./projects/demo/output/scene.json').scenes; if(s[0]?.title!=='高血压为什么会悄悄伤害血管'||s[0]?.avatar?.layout!=='hero'||s.at(-1)?.title!=='家庭血压管理') process.exit(1)"
          node -e "const c=require('./projects/demo/output/captions.json'); if(!Array.isArray(c)||c.length<2||!c.some(x=>x.characters?.length)) process.exit(1)"
          node -e "const c=require('./projects/demo/output/chapters.json'); if(!Array.isArray(c)||c.length<1||c.some(x=>x.duration<=0)) process.exit(1)"
