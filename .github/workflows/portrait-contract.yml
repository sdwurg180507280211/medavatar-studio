name: Portrait Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portrait-contract.yml'
      - '.github/workflows/ci.yml'
      - 'editor/src/App.tsx'
      - 'remotion/**'
      - 'projects/portrait-demo/**'
      - 'src/providers/heygen.ts'
      - 'src/providers/heygenAlphaContract.ts'
      - 'src/providers/types.ts'
      - 'src/cli.ts'
      - 'src/core/config.ts'
      - 'src/core/io.ts'
      - 'src/core/overrides.ts'
      - 'src/core/schema.ts'
      - 'src/editor/overrideDraft.ts'
      - 'src/storyboard.ts'
      - 'src/production/assets.ts'
      - 'src/production/avatarFreshnessContract.ts'
      - 'src/production/effectiveProject.ts'
      - 'src/production/renderPortraitGolden.ts'
      - 'src/production/renderProps.ts'
      - 'src/production/renderCommand.ts'
      - 'src/production/portraitIteration.ts'
      - 'src/production/visualModelContract.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  portrait-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Avatar freshness contract
        run: pnpm exec tsx src/production/avatarFreshnessContract.ts
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: HeyGen Alpha contract
        run: pnpm exec tsx src/providers/heygenAlphaContract.ts
      - name: Visual model contract
        run: |
          pnpm portrait:voice
          pnpm exec tsx src/production/visualModelContract.ts
      - name: Fast visual iteration contract
        run: |
          pnpm portrait:preview portrait-demo --scene vascular-pressure --dry-run
          pnpm portrait:still portrait-demo --scene silent-risk --at 1.2 --dry-run
          pnpm portrait:render portrait-demo --dry-run
      - name: Fast preview render smoke
        run: |
          pnpm portrait:preview portrait-demo --frames 0-9 --scale 0.25 --concurrency 50% --output /tmp/portrait-preview.mp4
          test -s /tmp/portrait-preview.mp4
      - name: Layout invariants
        run: |
          pnpm exec tsx -e "import {getCompositionLayout,getPipSize,getSubtitlePlacement,getVisualPanelRect} from './remotion/layout.ts'; const cases=[[1920,1080],[1080,1920],[1280,720],[720,1280],[1440,1440]]; for(const [w,h] of cases){const l=getCompositionLayout(w,h); const rects=[getVisualPanelRect(w,h,'visual_full','hidden'),getVisualPanelRect(w,h,'medical_animation','bottom-right')]; for(const r of rects){if(r.left<0||r.top<0||r.width<=0||r.height<=0||r.left+r.width>w||r.top+r.height>h) process.exit(1);} if(l.hero.top<0||l.hero.width>w||l.hero.top+l.hero.height>h) process.exit(1); const pip=getPipSize(w,h,0.28); const sub=getSubtitlePlacement(w,h,'bottom-right',pip); if(sub.left<0||sub.right<0||sub.bottom<0||sub.left+sub.right>=w) process.exit(1); if(l.portrait&&sub.bottom<l.pip.margin+pip) process.exit(1); if(l.portrait){const support=getVisualPanelRect(w,h,'doctor_ppt','hero'); const primary=getVisualPanelRect(w,h,'doctor_ppt','bottom-right'); if(!(support.width<primary.width&&primary.width>=w*0.85&&primary.left>=0&&primary.left+primary.width<=w)) process.exit(1);} }"
